<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Collapse navigator preview</title><link rel="stylesheet" href="./collapse-navigator.css"><style>body{margin:0;padding:24px;background:#f8fafc;font-family:Inter,sans-serif}.preview-layout{display:flex;gap:16px}.ui-collapse-nav{min-height:260px;border:1px solid #e2e8f0;border-radius:16px;background:#fff}.ui-collapse-nav__expanded{box-sizing:border-box;padding:16px}.preview-detail{min-width:0;flex:1;padding:20px;border:1px solid #e2e8f0;border-radius:16px;background:#fff}</style></head><body><div class="preview-layout"><aside class="ui-collapse-nav ui-collapse-nav--admin" data-collapse-nav><div class="ui-collapse-nav__expanded" data-expanded aria-hidden="false"><button class="ui-collapse-nav__toggle" type="button" data-toggle aria-expanded="true" aria-label="Collapse navigator">‹</button><h2>All items</h2><button type="button">Selected item</button></div><div class="ui-collapse-nav__compact" data-compact aria-hidden="true" inert><button class="ui-collapse-nav__toggle" type="button" data-toggle aria-expanded="false" aria-label="Expand navigator">›</button></div></aside><main class="preview-detail"><h2>Selected item</h2><p>The detail area expands smoothly.</p></main></div><script src="./collapse-navigator.js"></script></body></html>
